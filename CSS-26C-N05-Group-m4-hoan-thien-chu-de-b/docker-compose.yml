services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007

    command:
      - start-dev
      - --http-port=8080
      - --hostname=http://localhost:8080
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only}

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./config/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  resource-server-1:
    build:
      context: ./ma-nguon/resource-server

    environment:
      OIDC_ISSUER: http://localhost:8080/realms/ecommerce
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/ecommerce
      OIDC_AUDIENCE: app1-api

    depends_on:
      - keycloak

    ports:
      - "127.0.0.1:8001:8000"

  resource-server-2:
    build:
      context: ./ma-nguon/resource-server

    environment:
      OIDC_ISSUER: http://localhost:8080/realms/ecommerce
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/ecommerce
      OIDC_AUDIENCE: app2-api

    depends_on:
      - keycloak

    ports:
      - "127.0.0.1:8002:8000"

  resource-server-3:
    build:
      context: ./ma-nguon/resource-server

    environment:
      OIDC_ISSUER: http://localhost:8080/realms/ecommerce
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/ecommerce
      OIDC_AUDIENCE: app3-api

    depends_on:
      - keycloak

    ports:
      - "127.0.0.1:8003:8000"

  demo-app-1:
    build:
      context: ./ma-nguon/demo-app

    environment:
      APP_NAME: Application 1
      APP_PORT: 3001
      OIDC_CLIENT_ID: app1
      OIDC_ISSUER: http://localhost:8080/realms/ecommerce
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/ecommerce
      RESOURCE_SERVER_URL: http://resource-server-1:8000

    depends_on:
      - keycloak
      - resource-server-1

    ports:
      - "127.0.0.1:3001:8000"

  demo-app-2:
    build:
      context: ./ma-nguon/demo-app

    environment:
      APP_NAME: Application 2
      APP_PORT: 3002
      OIDC_CLIENT_ID: app2
      OIDC_ISSUER: http://localhost:8080/realms/ecommerce
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/ecommerce
      RESOURCE_SERVER_URL: http://resource-server-2:8000

    depends_on:
      - keycloak
      - resource-server-2

    ports:
      - "127.0.0.1:3002:8000"

  demo-app-3:
    build:
      context: ./ma-nguon/demo-app

    environment:
      APP_NAME: Application 3
      APP_PORT: 3003
      OIDC_CLIENT_ID: app3
      OIDC_ISSUER: http://localhost:8080/realms/ecommerce
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/ecommerce
      RESOURCE_SERVER_URL: http://resource-server-3:8000

    depends_on:
      - keycloak
      - resource-server-3

    ports:
      - "127.0.0.1:3003:8000"